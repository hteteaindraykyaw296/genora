name: Publish GENORA website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/configure-pages@v5

      - name: Prepare GENORA for the /genora/ address
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path("next.config.ts")
          config.write_text(config.read_text().replace(
              "output: 'export'", "basePath: '/genora', output: 'export'"
          ))

          files = [
              "app/page.tsx",
              "app/components/AnimatedLessons.tsx",
              "app/components/PortfolioCase.tsx",
              "lib/visuals.ts",
          ]
          pattern = r"""(['"])/(images/|videos/|research-overlap-|research-results\.csv|count-error\.png|methodology\.md|image-credits\.md)"""
          for filename in files:
              path = Path(filename)
              path.write_text(re.sub(pattern, r"\1/genora/\2", path.read_text()))
          PY

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
